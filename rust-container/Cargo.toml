[package]
name = "kiro-container"
version = "1.0.0"
edition = "2021"
description = "Lightweight container runtime for Kiro AI account automation"

[dependencies]
nix = { version = "0.29", features = ["sched", "mount", "signal", "user", "process", "fs", "hostname"] }
clap = { version = "4", features = ["derive"] }
